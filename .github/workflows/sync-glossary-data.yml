name: Sync glossary-data.js

on:
  push:
    branches: [main]
    paths:
      - GLOSSARY.md
      - glossary-tone.json
      - scripts/build-glossary-data.mjs
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate glossary-data.js from GLOSSARY.md
        run: node scripts/build-glossary-data.mjs

      - name: Commit glossary-data.js if it changed
        run: |
          if git diff --quiet -- glossary-data.js; then
            echo "glossary-data.js is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add glossary-data.js
            git commit -m "Auto-update glossary-data.js from GLOSSARY.md [skip ci]"
            # Another workflow can land a commit on main while this one is running,
            # and then this push is rejected and the web dictionary silently stays
            # a version behind. Pull the new commits underneath ours and try again.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected on attempt $attempt - main moved. Rebasing and retrying."
              git pull --rebase --autostash origin main
              sleep 3
            done
            echo "Could not push glossary-data.js after 5 attempts." >&2
            exit 1
          fi
