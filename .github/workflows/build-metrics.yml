name: Build metrics

on:
  push:
    branches: [main]
    paths:
      - GLOSSARY.md
      - data/corpus.json
      - scripts/build-metrics.mjs
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Score any new lines and write data/metrics.json
        run: node scripts/build-metrics.mjs

      - name: Commit the ledger and metrics if they changed
        run: |
          # Stage first: git diff alone cannot see a file that is not tracked yet,
          # which silently turned the first run of this workflow into a no-op.
          # The ledger is append-only: a new corpus line gets scored here once,
          # and that record has to be committed or the score would be recomputed
          # against a newer dictionary next time, which is the whole thing we
          # are trying not to do.
          git add data/metrics.json data/ledger.json
          if git diff --cached --quiet -- data/metrics.json data/ledger.json; then
            echo "Nothing new to score; metrics unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-update scores [skip ci]"
            # The glossary sync workflow fires on the same commit and also pushes,
            # so whoever finishes second has to catch up before pushing.
            git pull --rebase --autostash origin main
            git push
          fi
